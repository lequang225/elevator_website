{% extends "base.html" %}
{% block title %}Thêm người dùng{% endblock %}

{% block content %}
<section class="section">
    <div class="container form-container">
        <div class="admin-page-header"><h1>➕ Thêm người dùng</h1></div>
        <form method="POST" class="form card-form">
            <div class="form-group"><label>Tên đăng nhập *</label><input type="text" name="username" required autofocus></div>
            <div class="form-group"><label>Họ tên</label><input type="text" name="full_name"></div>
            <div class="form-group"><label>Email</label><input type="email" name="email"></div>
            <div class="form-group">
                <label>Vai trò *</label>
                <select name="role" required>
                    <option value="editor">✏️ Editor</option>
                    <option value="superadmin">👑 Super Admin</option>
                </select>
            </div>
            <div class="form-group"><label>Mật khẩu * (≥6 ký tự)</label><input type="password" name="password" required minlength="6"></div>
            <div class="form-group"><label>Xác nhận mật khẩu *</label><input type="password" name="confirm_password" required minlength="6"></div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Tạo tài khoản</button>
                <a href="/admin/users" class="btn btn-outline" style="color:#dc2626;border-color:#dc2626;">Hủy</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
