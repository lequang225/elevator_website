{% extends "base.html" %}
{% block title %}Đổi mật khẩu{% endblock %}

{% block content %}
<section class="section">
    <div class="container form-container">
        <div class="admin-page-header"><h1>🔐 Đổi mật khẩu</h1></div>
        <form method="POST" class="form card-form">
            <div class="form-group">
                <label>Mật khẩu hiện tại *</label>
                <input type="password" name="current_password" required autofocus>
            </div>
            <div class="form-group">
                <label>Mật khẩu mới * <small>(tối thiểu 6 ký tự)</small></label>
                <input type="password" name="new_password" required minlength="6">
            </div>
            <div class="form-group">
                <label>Xác nhận mật khẩu mới *</label>
                <input type="password" name="confirm_password" required minlength="6">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Cập nhật</button>
                <a href="/admin" class="btn btn-outline" style="color:#dc2626;border-color:#dc2626;">Hủy</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
